kind = "mobile"
previewPath = "/drift-mobile/"
title = "Drift — iPhone Sleep Sounds"
description = "An iPhone sleep sound app with five free sounds, one-tap favourites, offline downloads, gentle sleep timers and native background audio. A companion to the Drift web prototype."
version = "1.0.0"
id = "artifacts/drift-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/drift-mobile/" ]
localPort = 25424

[services.development]
run = "pnpm --filter @workspace/drift-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/drift-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/drift-mobile", "run", "serve" ]

[services.env]
PORT = "25424"
BASE_PATH = "/drift-mobile/"
