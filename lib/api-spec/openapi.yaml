openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /audio/{name}:
    get:
      operationId: getSleepAudio
      summary: Stream an original audio master
      description: Public generated audio. Supports HTTP byte-range requests.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [gentle-rain.mp3, ocean-waves.mp3, night-forest.mp3, soft-ambient.mp3]
        - name: Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Complete audio file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Partial audio content
        "404":
          description: Unknown sound
        "416":
          description: Invalid byte range
        "503":
          description: Audio unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

